name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push to `main` is one milestone commit, and the claim being made is that *that commit* is green
# — so pushes are never cancelled, however fast they arrive. A pull request is a moving target and
# only its last push is interesting, so a superseded run there is cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# There is deliberately no `services:` block. `pnpm verify:integration` owns the container
# lifecycle — it runs `docker compose up --wait` against the same `docker-compose.yml` a developer
# uses — and declaring the services here as well would bind the same ports twice and verify a
# different set of containers than anyone runs locally. CI must run the command the README does.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The suites that need no infrastructure: the domain rules and the browser stores.
      - name: Unit tests
        run: pnpm test:unit

      # Compose up, the PostgreSQL- and broker-backed suites, teardown — one command, the same one
      # a developer runs.
      - name: Integration verification
        run: pnpm verify:integration

      - name: Build
        run: pnpm build

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-integration-log
          path: .verify-output/integration.log
          if-no-files-found: ignore

  # §21's browser test, and the only job that needs the *applications* running rather than only the
  # infrastructure. Its own job rather than a step in `verify`: it owns a second Compose lifecycle
  # plus an API, a worker and a served bundle, and a runner that already tore its containers down
  # cannot host both. Same `services:` reasoning as above — `pnpm test:e2e` owns the lifecycle.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Chromium only, and `--with-deps` because a bare GitHub runner has none of the shared
      # libraries a headless browser links against.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Compose up, migrate, seed, build, API, worker, the spec, teardown — one command, the same
      # one a developer runs. It builds internally, so there is no separate build step here.
      - name: End-to-end verification
        run: pnpm test:e2e

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-e2e-log
          path: .verify-output/e2e.log
          if-no-files-found: ignore

      # The trace of a retried failure, which is the only thing that makes a timeout in this
      # pipeline diagnosable after the fact.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # The three §22 images, built and not pushed: there is no registry to push to and the point is
  # that the Dockerfiles stay buildable from a clean checkout. Deliberately *not* `verify:multi` —
  # that needs the whole stack plus a migrated database, and the `verify` job above already owns
  # one Compose lifecycle in this workflow. The smoke run is a local and pre-demo command.
  #
  # Since M24 each image is also **started**, because a green build was not a green start
  # (the third `[M14, P3]`, closed in M24): a pruned `node_modules`, a config nginx refuses,
  # a `CMD` that cannot find its entry point are all invisible to `docker build`. None of this needs
  # infrastructure — what each app can prove without a database is spelled out per step below.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web]

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          # Required by every step below, and easy to miss: with `push: false` and no `load`, the
          # image exists only in the builder's cache and `docker run pos-api:ci` says "no such
          # image". Buildx does not put it in the daemon unless it is told to.
          load: true
          tags: pos-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # The api needs PostgreSQL to be *ready*, and nothing at all to be *alive* — ADR 011 split
      # the two for exactly this kind of reason. So both halves are assertable with no
      # infrastructure: liveness must answer, and readiness must refuse. A readiness probe that
      # answered 200 here would be one that checks nothing.
      #
      # `API_HOST=0.0.0.0` only because the probe runs through `docker exec`; the default
      # `127.0.0.1` would serve it too. `wget` is busybox's.
      #
      # The readiness half reads the **status code** rather than wget's exit code, which was the
      # first version and was too weak to mean anything: wget exits non-zero on a 404 from a route
      # that no longer exists, on a refused connection, and on a container that died right after
      # the liveness probe — and all three would have been read as "correctly refused". Found by
      # the Codex review of M24. `-S` prints the response header on stderr; the `exit` in the awk
      # takes the first `HTTP/` line, because wget repeats the status in its own error line and the
      # second field there is a word.
      - name: Start the api image
        if: matrix.app == 'api'
        run: |
          docker run -d --name smoke -e API_HOST=0.0.0.0 pos-api:ci
          # `|| true` because the runner's shell is `bash -e -o pipefail` and busybox wget exits
          # non-zero on any status but 2xx — which is the case being measured. Without it the step
          # would die at the assignment below instead of reading the code out of it.
          status() {
            docker exec smoke wget -S -q -O /dev/null "$1" 2>&1 |
              awk '/^[[:space:]]*HTTP\//{print $2; exit}' || true
          }
          for _ in $(seq 1 30); do
            if [ "$(status http://127.0.0.1:3000/api/health/live)" = 200 ]; then
              live=1
              break
            fi
            sleep 1
          done
          if [ "${live:-}" != 1 ]; then
            docker logs smoke
            echo '::error::the api image never answered 200 on /api/health/live'
            exit 1
          fi
          ready=$(status http://127.0.0.1:3000/api/health/ready)
          if [ "$ready" != 503 ]; then
            docker logs smoke
            echo "::error::readiness answered '${ready:-nothing}' with no database behind it, not 503"
            exit 1
          fi
          docker rm -f smoke

      # The worker has no HTTP surface without `WORKER_HEALTH_PORT` and no way past its first read
      # without PostgreSQL, so what is provable here is the failure a build cannot catch: a pruned
      # dependency tree that does not resolve. Its entry point constructs the Kafka client, both
      # Redis connections and the print queue at import time and *then* reads `outbox_controls` —
      # so reaching that query is the whole module graph having loaded. It exits by itself.
      - name: Start the worker image
        if: matrix.app == 'worker'
        run: |
          output=$(docker run --rm pos-worker:ci 2>&1 || true)
          echo "$output" | tail -40
          if echo "$output" | grep -qE 'ERR_MODULE_NOT_FOUND|Cannot find (module|package)'; then
            echo '::error::the worker image cannot resolve something its entry point imports'
            exit 1
          fi
          if ! echo "$output" | grep -q 'outbox_controls'; then
            echo '::error::the worker image did not get as far as its first query'
            exit 1
          fi

      # The one that made this whole step possible. Until M24 `nginx.conf` resolved `api-1` when it
      # loaded, so nginx refused the config outside the Compose network and this image could not be
      # started anywhere but the full stack. `resolve` defers it; the bundle is static and needs no
      # replica to be served.
      - name: Start the web image
        if: matrix.app == 'web'
        run: |
          docker run -d --name smoke pos-web:ci
          for _ in $(seq 1 20); do
            if docker exec smoke wget -q -O /dev/null http://127.0.0.1:8080/; then
              served=1
              break
            fi
            sleep 1
          done
          if [ "${served:-}" != 1 ]; then
            docker logs smoke
            echo '::error::the web image did not serve the bundle'
            exit 1
          fi
          docker rm -f smoke
