name: CI

on:
  push:
    branches: [main]
  pull_request:

# There is deliberately no `services:` block. `pnpm verify:integration` owns the container
# lifecycle — it runs `docker compose up --wait` against the same `docker-compose.yml` a developer
# uses — and declaring the services here as well would bind the same ports twice and verify a
# different set of containers than anyone runs locally. CI must run the command the README does.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The suites that need no infrastructure: the domain rules and the browser stores.
      - name: Unit tests
        run: pnpm test:unit

      # Compose up, the PostgreSQL- and broker-backed suites, teardown — one command, the same one
      # a developer runs.
      - name: Integration verification
        run: pnpm verify:integration

      - name: Build
        run: pnpm build

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-integration-log
          path: .verify-output/integration.log
          if-no-files-found: ignore

  # The three §22 images, built and not pushed: there is no registry to push to and the point is
  # that the Dockerfiles stay buildable from a clean checkout. Deliberately *not* `verify:multi` —
  # that needs the whole stack plus a migrated database, and the `verify` job above already owns
  # one Compose lifecycle in this workflow. The smoke run is a local and pre-demo command.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web]

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: pos-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
