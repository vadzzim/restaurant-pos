# nginx in front of the API replicas. Included from inside `http {}` (conf.d), so `upstream` and
# `resolver` are both legal here.

# Docker's embedded DNS. Hard-coded rather than read from `/etc/resolv.conf`, which the base image
# can do — it exports `NGINX_LOCAL_RESOLVERS` from `15-local-resolvers.envsh` for use in a
# `templates/*.template` file — because that would move this file into the entrypoint's substitution
# path to gain portability to an orchestrator this demo does not deploy to. `127.0.0.11` is the
# address on every user-defined Compose network.
#
# `valid=10s` is how long a resolved address is trusted; it bounds how long a recreated replica is
# proxied to its old address. `ipv6=off` because the API binds `0.0.0.0` and an AAAA answer would
# be tried first and refused.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream pos_api {
    # `ip_hash`, not round robin. The client asks for `websocket` first but keeps `polling` as a
    # fallback (see `apps/web/src/realtime/socket.ts`), and a Socket.IO polling handshake is
    # several requests that must all reach the same instance: the second one round-robined to the
    # other replica gets "Session ID unknown" and the transport never establishes. The Redis
    # adapter shares *broadcasts* between instances (§13); it does not share session state.
    ip_hash;

    # `resolve` re-resolves each name on the `valid` interval above instead of once at config load,
    # and it requires the group to live in shared memory — hence `zone`. Without it a replica
    # recreated with a new address is proxied to the old one until nginx is reloaded, and, less
    # obviously, **this image cannot start outside the Compose network at all**: load-time
    # resolution of `api-1` fails and nginx refuses the config, which is why CI could build the
    # image and never run it — the three `[M14, P3]`s M24 closed (`build-log.md`).
    #
    # A variable `proxy_pass` is the other way to defer resolution and is wrong twice here: it
    # drops the URI unless the path is written back by hand, and it takes a single host, so
    # `ip_hash` above — load-bearing for the polling handshake — would go with it.
    #
    # `resolve` was nginx Plus-only until 1.27.3. The Dockerfile pins 1.29; do not lower it.
    zone pos_api 64k;
    server api-1:3000 resolve;
    server api-2:3000 resolve;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A single-page app with a router: every unknown path is a client route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://pos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # `/debug`'s long-lived reads and the health probes are all short; the default 60s read
        # timeout is left alone deliberately so a hung upstream surfaces rather than hangs the tab.
    }

    location /socket.io/ {
        proxy_pass http://pos_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A WebSocket carries no traffic between events; without this nginx closes it after 60s
        # and the POS sees a reconnect loop that looks like a broker problem.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
