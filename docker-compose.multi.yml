# The production-image stack: two API replicas behind the Redis adapter (§13), one worker, and
# nginx in front of both. Used together with the base file, which supplies the infrastructure:
#
#   docker compose -f docker-compose.yml -f docker-compose.multi.yml up -d --wait \
#     api-1 api-2 worker-prod web-prod
#
# `pnpm verify:multi` is the supported way to run it, and §19.10 is what it proves.
#
# These are new service names rather than overrides of the base file's `api`/`web`/`worker`. Those
# mount `.:/workspace` and run `tsx`, and Compose merges `volumes` by appending: an override can
# add a mount, never remove one, so a "production" override would still run with the source tree
# mounted over the image. Distinct names are the only way to get a clean container.
#
# The schema is not created here. `verify-multi-instance.mjs` creates the database, migrates and
# seeds it from the host before starting these, because migrations are `tsx` scripts and the images
# carry built output only — see the Dockerfiles.
#
# The *database* is created in two other places, both since M24 and neither of them here: the base
# file mounts `scripts/postgres-init/` into PostgreSQL's init directory, which covers a **fresh**
# volume brought up by hand, and the script keeps its `createdb` for every volume that already
# exists. It is in the base file rather than added to `postgres` from this overlay because an
# overlay that changes the base service's definition makes `docker compose up` **recreate the
# container** — so `verify:multi` would replace the PostgreSQL the user started for the demo every
# time it ran. Found by M24's review pass, after doing exactly that twice.
#
# That database is `pos_multi`, not `pos`. A smoke run writes orders — §19.10 applies a real
# mutation — and writing them into the demo database meant a demo opened afterwards showed two
# throwaway covers on table 19 (`known-problems.md`, `[M14, P2]`). `TEST_DATABASE_URL` in
# `@pos/config` established the convention; this stack is the one runner that never got it. The
# name is spelled here as the containers see it and in the script as the host sees it, and the two
# have to agree.
#
# **A separate database is only a third of the isolation, and the first attempt shipped only that**
# (found by the Codex review of M21). The runner preserves services that were already running, so
# the user's demo API and worker are a supported case — and while these three shared the demo's
# Kafka topic, its consumer groups and its Redis, a demo consumer could be handed a `pos_multi`
# event and write the projection into `pos`, and a demo realtime consumer could carry the broadcast
# §19.10 asserts, so the smoke test would pass with this stack's own consumer broken. Hence the
# `.multi` topic, the `-multi` groups and Redis database 1 below: three names and one number, and
# the two stacks cannot touch each other anywhere.

name: restaurant-pos

services:
  # The two replicas are two services, not `deploy.replicas: 2`, for one reason: §19.10 has to
  # address A and B separately — apply the mutation *through A* and watch the socket *on B*.
  # Replicas share one name and one port and cannot be told apart from the host.
  api-1:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: pos-api:local
    environment: &api_environment
      NODE_ENV: production
      LOG_LEVEL: warn
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://pos:pos@postgres:5432/pos_multi
      # Database 1: the demo stack is on 0, and the Socket.IO adapter, presence and §20's shared
      # counters all live in whichever one this points at.
      REDIS_URL: redis://redis:6379/1
      KAFKA_BROKERS: redpanda:29092
      KAFKA_ORDER_EVENTS_TOPIC: restaurant.order.events.multi
      KITCHEN_CONSUMER_GROUP: kitchen-multi
      REALTIME_CONSUMER_GROUP: realtime-multi
    ports:
      - '3001:3000'
    # `127.0.0.1`, never `localhost`: in the Node image `/etc/hosts` maps `localhost` to `::1` as
    # well, busybox wget tries that first, and Fastify bound to `0.0.0.0` is not listening on it.
    # The probe then reports "connection refused" against a perfectly healthy API.
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/health/ready']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on: &api_dependencies
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  api-2:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: pos-api:local
    environment: *api_environment
    ports:
      - '3002:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/health/ready']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on: *api_dependencies

  # Exactly one. The outbox lease makes concurrent claiming safe (§21.16) but nothing in this
  # demo asks for two publishers, and a second one would change what `/debug`'s backlog means.
  worker-prod:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: pos-worker:local
    environment:
      NODE_ENV: production
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://pos:pos@postgres:5432/pos_multi
      REDIS_URL: redis://redis:6379/1
      KAFKA_BROKERS: redpanda:29092
      KAFKA_ORDER_EVENTS_TOPIC: restaurant.order.events.multi
      KITCHEN_CONSUMER_GROUP: kitchen-multi
      REALTIME_CONSUMER_GROUP: realtime-multi
      # The fake printer is an endpoint on the API (§12.3); `localhost` here would be the worker
      # itself, and every ticket would dead-letter. Either replica serves it.
      PRINTER_URL: http://api-1:3000/api/printer/print
      # The worker's own readiness surface, bound to 127.0.0.1 inside the container (§17, M24).
      # `@pos/config` gives this knob no default, so nothing outside this file starts it: two
      # workers on one machine is a supported case and the second must not fail to bind.
      WORKER_HEALTH_PORT: '3100'
    # Without this, `up --wait` proved only that the container was running, and what actually
    # covered the worker was the smoke test's own round trip — so a worker that started and
    # immediately failed to reach the broker was reported by `verify:multi` as a *broadcast*
    # failure, the §19.10 assertion blaming the thing it tests (`[M14, P3]`, closed in M24).
    #
    # `/health/ready` is 503 until the broker session is up, the publisher loop has turned once and
    # BullMQ is consuming. `retries` is high because the first pass waits on a Kafka group join,
    # which on a cold Redpanda is tens of seconds.
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3100/health/ready']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      api-1:
        condition: service_healthy

  # One entry point in front of both replicas, which is what makes §19.10 visible in a browser:
  # two tabs on :8081 land on different instances and still see each other's orders.
  web-prod:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: pos-web:local
    ports:
      - '8081:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
